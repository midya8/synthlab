[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthlab"
version = "0.1.0"
description = "Inspectable finite bit-vector CEGIS with independent bounded optimality verification"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
synthlab = "synthlab.__main__:main"
synthlab-teaching = "synthlab.teaching_cli:main"

[tool.setuptools.packages.find]
include = ["synthlab*"]
